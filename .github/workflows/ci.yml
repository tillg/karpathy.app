name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 3 * * 1' }] # weekly, Monday 03:00 UTC
  workflow_dispatch:
  # The release workflow runs the same checks before it builds images.
  workflow_call:

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The backend tests run this image; built once here, so their parallel workers only hit the cache.
      - run: docker build --progress=plain -t kai-test-opencode -f deploy/opencode/Dockerfile .
        timeout-minutes: 10
      - run: docker build -q -t kai-test-egress-img -f deploy/egress/Dockerfile .
      - run: npm test
      # Every environment in deploy/settings/ validates.
      - run: node_modules/.bin/tsx packages/settings/src/cli.ts check
      - run: npm run build -w apps/web
      # Dev stacks take their ports from deploy/stack.sh (`just dev up`); render stack 1.
      - run: docker compose -f deploy/compose.yml -f deploy/compose.dev.yml config -q
        env: { DOMAIN: ci.example.com, GIT_AUTHOR_NAME: ci, GIT_AUTHOR_EMAIL: ci@example.com, STACK: "1", PROXY_PORT: "8010", BACKEND_PORT: "8011" }

  ansible:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: deploy/ansible } }
    # Syntax checks don't decrypt the vaults; the dummy password only satisfies the vault client.
    env: { ANSIBLE_VAULT_PASSWORD: dummy }
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-core && pipx install ansible-lint
      # Into the user path explicitly: the runner's preinstalled Ansible has them elsewhere, and
      # pipx's ansible-lint only sees ~/.ansible/collections.
      - run: ansible-galaxy collection install --force -r requirements.yml -p ~/.ansible/collections
      - run: ansible-lint
      - run: |
          for t in local hetzner; do
            ansible-playbook -i "inventories/$t" --vault-id "$t@vault-pass-client.sh" --syntax-check site.yml
          done

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:github
        env: { TEST_VAULT_TOKEN: '${{ secrets.TEST_VAULT_TOKEN }}' }
      # Real model turns on a local Ollama (no provider key): pull the models (text + vision) into a volume once.
      - run: |
          docker volume create ollama-models
          docker run -d --name pull -v ollama-models:/root/.ollama ollama/ollama
          sleep 3 && docker exec pull ollama pull "$(node_modules/.bin/tsx packages/settings/src/cli.ts get test ai.model | sed 's|^ollama/||')" && docker exec pull ollama pull "$(node_modules/.bin/tsx packages/settings/src/cli.ts get test ai.vision_model | sed 's|^ollama/||')" && docker rm -f pull
      - run: npm run test:llm
        env: { OLLAMA_VOLUME: ollama-models }
