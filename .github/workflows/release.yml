# Release: a tag vX.Y.Z (or vX.Y.Z-rc.N) → checks → multi-arch images on GHCR → GitHub release
# with deploy/compose.yml as release asset (specs/system/deployment.md).
name: Release
on:
  push:
    tags: ['v*.*.*']

# Read-only by default; only the jobs that push images or create the release get write access.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/tillg/karpathy.app

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    # The ingest image's build in the checks needs the ingest-email deploy key.
    secrets: inherit

  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      latest: ${{ steps.v.outputs.latest }}
      built: ${{ steps.v.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # One version string without the v: image tag, APP_VERSION and what /api/health reports.
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          prerelease=false; [[ "$version" == *-rc.* ]] && prerelease=true
          # :latest and GitHub's "Latest" only move forward: a hotfix on an older line doesn't take them.
          highest=$(git tag -l 'v*.*.*' | grep -Ev -- '-' | sort -V | tail -n 1 || true)
          latest=false; [ "$prerelease" = false ] && [ "$GITHUB_REF_NAME" = "$highest" ] && latest=true
          # One build time for all images of the release: BUILT_AT, what /api/health reports as `built`.
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "version=$version"; echo "prerelease=$prerelease"; echo "latest=$latest"; echo "built=$built"; } >> "$GITHUB_OUTPUT"
      # Final releases only from main; release candidates may come from any commit (specs/system/deployment.md, key decisions).
      - if: steps.v.outputs.prerelease == 'false'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

  build:
    needs: [check, guard]
    strategy:
      matrix:
        image: [proxy, backend, opencode, egress, ingest]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      # The ingest image's build context: the private ingest-email repo at its pinned commit (read-only deploy key).
      - if: matrix.image == 'ingest'
        id: ie
        run: echo "ref=$(cat deploy/ingest/ingest-email.ref)" >> "$GITHUB_OUTPUT"
      - if: matrix.image == 'ingest'
        uses: actions/checkout@v4
        with: { repository: tillg/ingest_email, ref: '${{ steps.ie.outputs.ref }}', ssh-key: '${{ secrets.INGEST_EMAIL_DEPLOY_KEY }}', path: tmp/ingest_email-src, persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      # Pushed by digest only; the manifest job puts the version tag on both arches at once.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ needs.guard.outputs.version }}
            BUILT_AT=${{ needs.guard.outputs.built }}
          build-contexts: ${{ matrix.image == 'ingest' && 'ingest_email=tmp/ingest_email-src' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - run: mkdir -p digests && echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with: { name: 'digest-${{ matrix.image }}-${{ matrix.arch }}', path: digests/*, retention-days: 1 }

  manifest:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        image: [proxy, backend, opencode, egress, ingest]
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'digest-${{ matrix.image }}-*', merge-multiple: true, path: digests }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      # Release candidates and hotfixes on older lines never move :latest.
      - env:
          IMAGE: ${{ env.REGISTRY }}-${{ matrix.image }}
          VERSION: ${{ needs.guard.outputs.version }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          [ "$LATEST" = true ] && tags+=(-t "$IMAGE:latest")
          mapfile -t refs < <(sed "s|^|$IMAGE@|" digests/*)
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    needs: [guard, manifest]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      # compose.yml is the release asset a deployment downloads (specs/system/deployment.md, key decisions).
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: |
          flags=(--latest="$LATEST"); [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}" deploy/compose.yml
