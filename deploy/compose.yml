# karpathy.app stack (mvp §2.5). Only the proxy publishes ports; opencode is internal-only and
# reaches the internet only through the egress proxy.
name: karpathy-app

x-app-user: &app-user "${APP_UID:-1000}:${APP_GID:-1000}"
# Bounded container logs (json-file, 3 × 10 MB per container).
x-logging: &logs { driver: json-file, options: { max-size: 10m, max-file: "3" } }
# Images: a release runs the GHCR images of its version (APP_VERSION, no v); prodtest builds them as :dev.

services:
  proxy:
    image: ghcr.io/tillg/karpathy.app-proxy:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/proxy/Dockerfile }
    restart: unless-stopped
    # No port 80: certificates come via DNS-01. BIND_IP is the tailnet IP on a server.
    ports: ["${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logs
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-dns}
      DNS_PROVIDER: ${DNS_PROVIDER:-godaddy}
      DNS_API_TOKEN_FILE: /run/secrets/dns_api_token
    secrets: [dns_api_token]
    volumes: [caddy-data:/data]
    # Caddy's own plain-HTTP health site inside the container (Caddyfile); independent of the backend.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge, internal]

  backend:
    image: ghcr.io/tillg/karpathy.app-backend:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/backend/Dockerfile }
    restart: unless-stopped
    # PID 1 is `npm exec`, which doesn't reap orphans: without an init every git child stayed a zombie.
    init: true
    user: *app-user
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
    environment:
      # The settings rendered from deploy/settings/ (`just settings render`); secrets stay compose secrets.
      SETTINGS_FILE: /etc/karpathy/settings.json
      OPENCODE_URL: http://opencode:4096
      OPENCODE_VAULTS_DIR: /vaults
      # The ingest service's internal endpoint (Admin › Instagram), token-guarded.
      INGEST_URL: http://ingest:8090
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
      # Commit and log timestamps in the target's timezone (role app writes TZ to .env).
      TZ: ${TZ:-Etc/UTC}
      # When the running release was deployed, reported by /api/health (role app writes it to .env).
      DEPLOYED_AT: ${DEPLOYED_AT:-}
    secrets: [bearer_token, github_token, opencode_password, ingest_token]
    volumes:
      - vaults:/vaults
      - config:/config
      # SETTINGS_DIR: the rendered settings, relative to this file; unset on a target (shared/ is the project dir).
      # Not created when missing (a directory would block every later render): render first.
      - { type: bind, source: "${SETTINGS_DIR:-.}/settings.json", target: /etc/karpathy/settings.json, read_only: true, bind: { create_host_path: false } }
    depends_on:
      opencode: { condition: service_healthy }
    # egress: the backend itself needs GitHub.
    networks: [internal, egress]

  opencode:
    image: ghcr.io/tillg/karpathy.app-opencode:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/opencode/Dockerfile }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
    # opencode as PID 1 ignores SIGTERM (every stop was a SIGKILL after 10 s, #38).
    init: true
    user: *app-user
    # The gateway's API key and provider config (OPENCODE_CONFIG_CONTENT: merged after a vault's own
    # opencode.json; /etc/opencode/opencode.json still wins), Exa, the web caps and OPENCODE_MODEL, rendered from
    # deploy/settings/.
    env_file: [{ path: "${SETTINGS_DIR:-.}/opencode.env", required: false }]
    environment:
      # All outbound HTTP (LLM provider, Exa, webfetch) goes through the egress proxy; loopback stays direct
      # (the plugin client talks to 0.0.0.0:4096). Dev and prodtest add the Ollama host to NO_PROXY.
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,0.0.0.0
    secrets: [opencode_password]
    tmpfs: ["/home/app:uid=${APP_UID:-1000},gid=${APP_GID:-1000},mode=0700"]
    volumes:
      - vaults:/vaults
      - opencode-data:/data
    # /global/health needs the password too (basic auth; busybox wget has no --user).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"Authorization: Basic $$(printf 'opencode:%s' \"$$(cat /run/secrets/opencode_password)\" | base64 | tr -d '\\n')\" http://127.0.0.1:4096/global/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      egress: { condition: service_healthy }
    networks: [internal]

  # Fetches mail and resolves the links in it into the vaults' Input/ (deploy/ingest). Parses untrusted mail and
  # web pages, so it is confined like opencode: internal network, egress proxy only, no app secrets. The deploy adds
  # the mounts of the configured vaults (Input/ rw, Sources/ ro); dev and prodtest mount the whole volume.
  ingest:
    image: ghcr.io/tillg/karpathy.app-ingest:${APP_VERSION:-dev}
    # ingest-email is a private repo, checked out beside the build by deploy/ingest/fetch-source.sh.
    build: { context: .., dockerfile: deploy/ingest/Dockerfile, additional_contexts: { ingest_email: ../tmp/ingest_email-src } }
    restart: unless-stopped
    init: true
    user: *app-user
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
    environment:
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1
      # gog (Gmail): token store in the file keyring under /state, its password from the secret (run.sh).
      GOG_HOME: /state/gog
      GOG_KEYRING_BACKEND: file
      # instascraper keeps its session and activity ledger under ~/.config/instascraper.
      HOME: /state/home
    secrets: [gog_keyring_password, ingest_token]
    volumes:
      - ingest-state:/state
      # Its profiles, rendered from deploy/settings/ (ingest.profiles) like settings.json.
      - { type: bind, source: "${SETTINGS_DIR:-.}/ingest.json", target: /etc/ingest/config.json, read_only: true, bind: { create_host_path: false } }
    # run.sh touches the heartbeat after every round (≤ 1 min, plus Instagram pacing); 20 min without one = stuck.
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /state/last-run -mmin -20 2>/dev/null)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      egress: { condition: service_healthy }
    networks: [internal]

  # The only way from opencode to the internet: public destinations only (no loopback, private,
  # link-local or tailnet addresses, also after redirects), so the AI's web fetches can't reach
  # the backend, other containers or the cloud metadata service.
  egress:
    image: ghcr.io/tillg/karpathy.app-egress:${APP_VERSION:-dev}
    build: { context: .., dockerfile: deploy/egress/Dockerfile }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logs
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3128"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [internal, egress]

networks:
  edge: {}
  # No route out: opencode's only way to the internet is the egress proxy.
  internal: { internal: true }
  # Internet access for the egress proxy and the backend (GitHub).
  egress: {}

volumes:
  vaults: {}
  config: {}
  opencode-data: {}
  caddy-data: {}
  ingest-state: {}

secrets:
  bearer_token: { file: ./secrets/bearer_token }
  opencode_password: { file: ./secrets/opencode_password }
  github_token: { file: ./secrets/github_token }
  dns_api_token: { file: ./secrets/dns_api_token }
  gog_keyring_password: { file: ./secrets/gog_keyring_password }
  ingest_token: { file: ./secrets/ingest_token }
