# Host settings for `hetzner` (specs/system/deployment.md). The app's settings are deploy/settings/hetzner.yaml;
# secrets: vault.yml (vault_*), mapped here or read by role app (roles/app/vars/main.yml).
target: hetzner
tailscale_enabled: true
timezone: Europe/Berlin
# Ansible (and you) log in as ops with these keys (keys/hetzner.pub, one per line) after the bootstrap.
# Not in the inventory dir: Ansible would parse the file as an inventory and make a host of it.
admin_authorized_keys: "{{ lookup('file', playbook_dir ~ '/keys/hetzner.pub').splitlines() }}"
vaults_fs_size: 20G

# The tailnet IP, from the tailscale role .
bind_ip: "{{ ansible_facts.tailscale0.ipv4.address | default('') }}"
https_port: 443
# The app as the operator's devices reach it (`just token hetzner --qr`).
app_url: https://app.karpathy.app
# Must equal proxy.domain in deploy/settings/ (role app checks); the monitoring role reads it too.
domain: app.karpathy.app
gatus_enabled: true

bearer_token: "{{ vault_bearer_token }}"
github_token: "{{ vault_github_token }}"
dns_api_token: "{{ vault_dns_api_token }}"
ntfy_topic: "{{ vault_ntfy_topic }}"
heartbeat_url: "{{ vault_heartbeat_url }}"
beszel_password: "{{ vault_beszel_password }}"
beszel_hub_key: "{{ vault_beszel_hub_key }}"
beszel_hub_pubkey: "{{ vault_beszel_hub_pubkey }}"
beszel_token: "{{ vault_beszel_token }}"
# Single-use, tagged tag:server, pre-approved; only used when the host joins the tailnet.
tailscale_authkey: "{{ vault_tailscale_authkey }}"
