# Host settings for `local` (specs/system/deployment.md). The app's settings are deploy/settings/local.yaml;
# secrets: vault.yml (vault_*), mapped here or read by role app (roles/app/vars/main.yml).
target: local
tailscale_enabled: false
timezone: Europe/Berlin
admin_authorized_keys: []
vaults_fs_size: 5G

bind_ip: 0.0.0.0
https_port: 443
# The app as the operator's devices reach it (`just token local --qr`).
app_url: https://localhost:9444
# Must equal proxy.domain in deploy/settings/ (role app checks); the monitoring role reads it too.
domain: localhost
gatus_enabled: false
# The Mac's tmp/dev/remotes, mounted into the VM at /remotes (e2e bare repos; deploy/settings/local.yaml
# points git.remote_base at file:///remotes/).
remotes_dir: /remotes

bearer_token: "{{ vault_bearer_token }}"
github_token: "{{ vault_github_token }}"
dns_api_token: "{{ vault_dns_api_token }}"
ntfy_topic: "{{ vault_ntfy_topic }}"
heartbeat_url: "{{ vault_heartbeat_url }}"
beszel_password: "{{ vault_beszel_password }}"
beszel_hub_key: "{{ vault_beszel_hub_key }}"
beszel_hub_pubkey: "{{ vault_beszel_hub_pubkey }}"
beszel_token: "{{ vault_beszel_token }}"
