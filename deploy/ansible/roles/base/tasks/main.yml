# App and login users, sshd hardening, unattended upgrades, timezone.
# base_app_user false (dev.yml, a remote dev host): no deploy user; the login user takes uid/gid 1000 instead.
- name: Look up uid {{ base_uid }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ base_uid }}"
    fail_key: false

# Another user on 1000 (e.g. a VM's default user) would own the vaults: stop rather than pick another uid.
- name: Uid 1000 free or already {{ base_uid_user }}
  ansible.builtin.assert:
    # getent keys its result by user name (or by the uid, with value None, when there is none).
    that: ansible_facts.getent_passwd | dict2items | rejectattr('value', 'none') | map(attribute='key') | list in [[], [base_uid_user]]
    fail_msg: "uid {{ base_uid }} belongs to another user; the images and /srv/vaults need it for {{ base_uid_user }}"

- name: Look up gid {{ base_gid }}
  ansible.builtin.getent:
    database: group
    key: "{{ base_gid }}"
    fail_key: false

- name: Gid 1000 free or already the group {{ base_uid_user }}
  ansible.builtin.assert:
    that: ansible_facts.getent_group | dict2items | rejectattr('value', 'none') | map(attribute='key') | list in [[], [base_uid_user]]
    fail_msg: "gid {{ base_gid }} belongs to another group; the images and /srv/vaults need it for {{ base_uid_user }}"

# Two users with one job each (a container breakout must not land on a sudoer):
# - deploy (uid 1000): the app's uid inside the containers and owner of /srv/vaults. No login,
#   no sudo, no docker group.
# - ops (uid 1001): the login Ansible and you use, with sudo and the docker group.
- name: App group
  ansible.builtin.group:
    name: "{{ deploy_user }}"
    gid: "{{ deploy_gid }}"
  when: base_app_user

- name: App user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    uid: "{{ deploy_uid }}"
    group: "{{ deploy_user }}"
    password: "!"
    update_password: on_create
  when: base_app_user

- name: Login group, gid {{ base_gid }}
  ansible.builtin.group:
    name: "{{ admin_user }}"
    gid: "{{ base_gid }}"
  when: not base_app_user

- name: Login user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: "{{ admin_uid }}"
    group: "{{ omit if base_app_user else admin_user }}"
    shell: /bin/bash
    password: "!"
    update_password: on_create

- name: Login user's SSH keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_authorized_keys | join('\n') }}"
    exclusive: true
  when: admin_authorized_keys | length > 0

- name: Login user may sudo without a password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ admin_user }}
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# Taking deploy's login, sudo and docker rights away while Ansible is logged in as deploy would cut
# off the run itself: only when connected as someone else (ops, root, or the VM's own user).
- name: App user loses login, sudo and docker
  when: base_app_user and ansible_user | default('') != deploy_user
  block:
    - name: No sudo for the app user
      ansible.builtin.file:
        path: /etc/sudoers.d/90-{{ deploy_user }}
        state: absent
    - name: No SSH keys for the app user
      ansible.builtin.file:
        path: /home/{{ deploy_user }}/.ssh/authorized_keys
        state: absent
    - name: No shell and no extra groups for the app user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /usr/sbin/nologin
        groups: []
        append: false

# Hardening ends root and password logins: on a server, the login user's key must be in place first.
- name: The login user can log in before root and passwords are switched off
  ansible.builtin.assert:
    that: admin_authorized_keys | length > 0
    fail_msg: "admin_authorized_keys is empty: hardening sshd now would lock you out of {{ target }}"

# sshd uses the first value it reads: 10- comes before cloud-init's 50-cloud-init.conf.
- name: Harden sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-karpathy.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
  notify: Restart sshd

# A run that wrote the file but died before the handler ran left sshd on the old config, and later
# runs saw the file unchanged. The marker records that sshd was restarted with the hardening.
- name: Has sshd been restarted with the hardening
  ansible.builtin.stat:
    path: /var/lib/karpathy-sshd-hardened
  register: base_sshd_marker

- name: Restart sshd still pending
  ansible.builtin.debug:
    msg: sshd still runs without the hardening; restarting it at the end of the run
  when: not base_sshd_marker.stat.exists
  changed_when: true
  notify: Restart sshd

- name: Unattended upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the periodic upgrade run
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: base_tz
  changed_when: false
  check_mode: false

- name: Timezone {{ timezone }}
  ansible.builtin.command: timedatectl set-timezone {{ timezone }}
  when: base_tz.stdout != timezone
  changed_when: true
