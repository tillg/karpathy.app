# What a checkout on a remote dev host needs for `just check`, `just dev up`, `just e2e` and `claude`
# (Docker comes from role docker).
- name: Command-line tools
  ansible.builtin.apt:
    name: [git, ripgrep, jq, netcat-openbsd, ansible-core, btop]   # ansible: `just check` renders a role template
    state: present
    update_cache: true
    cache_valid_time: 3600

# Upstream's release, not Ubuntu's just (1.21 can't parse the repo's justfile).
- name: No Ubuntu just
  ansible.builtin.apt:
    name: just
    state: absent

- name: Installed just
  ansible.builtin.command: /usr/local/bin/just --version
  register: devtools_just
  changed_when: false
  failed_when: false
  check_mode: false

- name: Just {{ devtools_just_version }}
  ansible.builtin.unarchive:
    src: "{{ devtools_just_url }}"
    remote_src: true
    dest: /usr/local/bin
    include: [just]
  when: devtools_just.stdout != 'just ' ~ devtools_just_version

- name: NodeSource apt repo (Node 22)
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: https://deb.nodesource.com/node_22.x
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

- name: GitHub CLI apt repo
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: https://cli.github.com/packages
    suites: stable
    components: main
    signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg

- name: Node 22 and gh
  ansible.builtin.apt:
    name: [nodejs, gh]
    state: present
    update_cache: true

# ~/.local/bin (claude, herdr) also for non-login shells: herdr's and tmux's panes read ~/.bashrc, not ~/.profile.
- name: ~/.local/bin on the PATH of every interactive shell
  ansible.builtin.blockinfile:
    path: /home/{{ admin_user }}/.bashrc
    marker: "# {mark} karpathy devtools"
    block: |
      case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) PATH="$HOME/.local/bin:$PATH" ;; esac
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    create: true

# The native installer, per user into ~/.local/bin; it updates itself.
- name: Claude Code CLI
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
    creates: /home/{{ admin_user }}/.local/bin/claude
  become: true
  become_user: "{{ admin_user }}"

# Browser and system libraries for `just e2e`; --with-deps installs the libraries through sudo.
- name: Playwright Chromium {{ devtools_playwright_version }}
  ansible.builtin.shell: >-
    npx -y playwright@{{ devtools_playwright_version }} install --with-deps chromium
    && touch ~/.cache/ms-playwright/.karpathy-{{ devtools_playwright_version }}
  args:
    executable: /bin/bash
    creates: /home/{{ admin_user }}/.cache/ms-playwright/.karpathy-{{ devtools_playwright_version }}
  become: true
  become_user: "{{ admin_user }}"

# Host secrets: the provider keys every checkout falls back to (deploy/stack.sh secrets_from_host).
- name: Host secrets folder
  ansible.builtin.file:
    path: /home/{{ admin_user }}/.config/karpathy/secrets
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Host secrets
  ansible.builtin.copy:
    dest: /home/{{ admin_user }}/.config/karpathy/secrets/{{ item.key }}
    content: "{{ item.value }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  loop: "{{ devtools_host_secrets | dict2items | selectattr('value') }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# The identity commits from the dev host carry.
- name: Git identity
  ansible.builtin.shell: |  # noqa: command-instead-of-module
    [ "$(git config --global --get user.{{ item.key }})" = {{ item.value | quote }} ] && exit 0
    git config --global user.{{ item.key }} {{ item.value | quote }} && echo changed
  register: devtools_git_identity
  changed_when: "'changed' in devtools_git_identity.stdout"
  loop: "{{ devtools_git_user | dict2items | selectattr('value') }}"
  loop_control:
    label: user.{{ item.key }}
  become: true
  become_user: "{{ admin_user }}"

# The fine-grained GitHub token (karpathy.app, karpathy_demo_wiki, ingest_email) for git over HTTPS.
- name: Git's credential helper
  ansible.builtin.command: git config --global --get credential.helper  # noqa: command-instead-of-module
  register: devtools_git_helper
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: "{{ admin_user }}"

- name: Git stores credentials
  ansible.builtin.command: git config --global credential.helper store  # noqa: command-instead-of-module
  when: devtools_github_token | length > 0 and devtools_git_helper.stdout != 'store'
  changed_when: true
  become: true
  become_user: "{{ admin_user }}"

- name: GitHub token as git credential
  ansible.builtin.copy:
    dest: /home/{{ admin_user }}/.git-credentials
    content: "https://x-access-token:{{ devtools_github_token }}@github.com\n"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when: devtools_github_token | length > 0
  no_log: true
