# A remote dev host (deploy/README.md, "Dev server"): `just devhost`. Like a target's host part (site.yml), without
# vaults_fs, app and monitoring; plus the browser editor (code_server).
- name: Dev host
  hosts: all
  become: true
  vars:
    # The developer's login (admin_user, from the inventory) at uid/gid 1000: compose.dev.yml runs the web container
    # as APP_UID 1000 over the bind-mounted sources. No deploy user: a dev host holds no prod vaults.
    base_app_user: false
    admin_uid: 1000
  roles:
    - base
    - { role: tailscale, when: tailscale_enabled }
    - docker
    - devtools
    - { role: code_server, when: code_server_enabled }
