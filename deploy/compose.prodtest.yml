# Local smoke test of the PROD images (proxy with the built PWA, backend prod target, opencode),
# paired with this checkout's dev stack N (deploy/stack.sh). Test-only; never use for a real deployment.
#
#   just prodtest            # project karpathy-app-N-prodtest on https://localhost:80N5
#   just prodtest e2e [playwright args]
#   just prodtest down
#
# Differences from prod: https://localhost:80N5 with Caddy's internal CA (TLS_MODE=internal selects
# the tls-internal snippet in the prod Caddyfile instead of DNS-01), local bare repos from
# tmp/dev/remotes instead of GitHub, and throwaway secrets. The model is production's, on OpenRouter (the key from
# deploy/secrets/).
services:
  proxy:
    ports: !override ["${PRODTEST_PORT:?start prodtest with just prodtest}:443"]

  backend:
    volumes:
      - ../tmp/dev/remotes:/remotes

  # The whole vaults volume (deploy/settings/prodtest.yaml has no ingest profiles: the loop idles).
  ingest:
    volumes:
      - vaults:/vaults

secrets:
  bearer_token: { file: ../tmp/prodtest/secrets/bearer_token }
  opencode_password: { file: ../tmp/prodtest/secrets/opencode_password }
  github_token: { file: ../tmp/prodtest/secrets/github_token }
  dns_api_token: { file: ../tmp/prodtest/secrets/dns_api_token }
  gog_keyring_password: { file: ../tmp/prodtest/secrets/gog_keyring_password }
  ingest_token: { file: ../tmp/prodtest/secrets/ingest_token }
