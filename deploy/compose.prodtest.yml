# Local smoke test of the PROD images (proxy with the built PWA, backend prod target, opencode),
# paired with this checkout's dev stack N (deploy/stack.sh). Test-only; never use for a real deployment.
#
#   just prodtest            # project karpathy-app-N-prodtest on https://localhost:80N5
#   just prodtest e2e [playwright args]
#   just prodtest down
#
# Differences from prod: https://localhost:80N5 with Caddy's internal CA (TLS_MODE=internal selects
# the tls-internal snippet in the prod Caddyfile instead of DNS-01), local bare repos from
# tmp/dev/remotes instead of GitHub, throwaway secrets, and the native Ollama on the Mac as the
# model (`just ollama install`, reached through the /v1-only relay proxy/Caddyfile.ollama-relay).
services:
  proxy:
    ports: !override ["${PRODTEST_PORT:?start prodtest with just prodtest}:443"]
    environment:
      DOMAIN: localhost
      TLS_MODE: internal

  backend:
    environment:
      GIT_REMOTE_BASE: file:///remotes/
      DEFAULT_MODEL: ollama/qwen2.5:3b
    volumes:
      - ../tmp/dev/remotes:/remotes

  opencode:
    environment:
      OPENCODE_MODEL: ollama/qwen2.5:3b
      OPENCODE_CONFIG: /etc/opencode-dev/ollama.json
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,ollama.internal
    volumes:
      - ./opencode/dev-ollama.json:/etc/opencode-dev/ollama.json:ro

  # No profiles: the loop idles (prodtest never reads a real Gmail label).
  ingest:
    volumes:
      - ingest-state:/state
      - ./ingest/config.none.json:/etc/ingest/config.json:ro
      - vaults:/vaults

  # ollama.internal:11434 (on this project's internal network) → the native Ollama on the Mac, /v1 API only.
  ollama-bridge:
    image: caddy:2.10-alpine
    volumes: ["./proxy/Caddyfile.ollama-relay:/etc/caddy/Caddyfile:ro"]
    networks:
      internal: { aliases: [ollama.internal] }
      egress: {}

secrets:
  bearer_token: { file: ../tmp/prodtest/secrets/bearer_token }
  opencode_password: { file: ../tmp/prodtest/secrets/opencode_password }
  github_token: { file: ../tmp/prodtest/secrets/github_token }
  dns_api_token: { file: ../tmp/prodtest/secrets/dns_api_token }
  gog_keyring_password: { file: ../tmp/prodtest/secrets/gog_keyring_password }
  ingest_token: { file: ../tmp/prodtest/secrets/ingest_token }
