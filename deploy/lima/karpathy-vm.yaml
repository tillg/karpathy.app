# The `local` deploy target: a throwaway Ubuntu 24.04 VM sized like the Hetzner CX23
# (specs/system/deployment.md §6). Created and driven by `just vm up|down|reset|ssh`.
minimumLimaVersion: 2.0.0

# Ubuntu image only: no home-directory mounts (the target holds no copy of the source).
base:
- template:_images/ubuntu-24.04

vmType: vz
cpus: 2
memory: 4GiB
disk: 40GiB

# Docker comes from the Ansible `docker` role, as on Hetzner.
containerd:
  system: false
  user: false

# The e2e suite's bare repos (Mac: tmp/dev/remotes), cloned by the backend from /remotes.
# `just vm up` sets the absolute location, which depends on the checkout.
mounts:
- location: "/tmp/karpathy-remotes-unset"
  mountPoint: /remotes
  writable: true

# The guest user gets uid = the Mac's uid, but cloud-init gives its group gid 1000, which the
# `deploy` user needs (images and /srv/vaults assume 1000:1000). Lima can't set a gid: move it.
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eu
    u="{{.User}}"
    if [ "$(getent group 1000 | cut -d: -f1)" = "$u" ]; then
      groupmod -g 1999 "$u"
      find "$(getent passwd "$u" | cut -d: -f6)" -xdev -gid 1000 -exec chgrp -h "$u" {} +
    fi

# Only these reach the Mac; 8010-8099 (dev stacks and their prodtest) are taken. Everything else stays in the VM.
portForwards:
- { guestPort: 443, hostPort: 9444 }
- { guestPort: 8090, hostPort: 9090 }
- { guestPort: 8091, hostPort: 9091 }
- { guestPortRange: [1, 65535], ignore: true }
