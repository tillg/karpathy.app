# Central app settings (specs/system/…, issue #133). Every environment starts from these values;
# <env>.yaml lists only what that environment changes, <env>.local.yaml (gitignored, dev and prodtest)
# is a developer's own override on top. Secrets are references ({ secret: name }), never values: the
# value is the file deploy/secrets/<name> in dev, the target's Ansible Vault on a server.
# `just settings show <env>` prints the merged result.

ai:
  gateway: openrouter            # a key of `gateways`
  model: openrouter/z-ai/glm-5.3 # the default model; Admin may override it per installation
  # Writes the chat titles (#148); a model of ai.gateway. Unset = ai.model. Admin may override it.
  # title_model: openrouter/z-ai/glm-5.3
  # Looks at images for the chat model (tool look_at_image, #146). Same gateway; must speak the OpenAI chat API.
  vision_model: openrouter/mistralai/mistral-medium-3-5
  web:
    access: true                 # default of the Admin "web access" switch
    fetch_cap: 20                # per-turn limits on the AI's web calls
    search_cap: 20
    exa_api_key: { secret: exa_api_key, optional: true }

auth:
  bearer_token: { secret: bearer_token }
  opencode_password: { secret: opencode_password }

git:
  remote_base: https://github.com/
  author: { name: karpathy.app user, email: user@karpathy.app }
  # The deployment's token; a token set in the app's settings wins.
  github_token: { secret: github_token, optional: true }

proxy:
  domain: localhost
  tls: internal                  # internal (Caddy's own CA) | dns (Let's Encrypt via DNS-01)
  dns: { provider: godaddy, api_token: { secret: dns_api_token, optional: true } }

timezone: Etc/UTC                # commit and log times
commit_reminder_threshold: 4

files:
  visible_dot_dirs: [.agents]    # dot-dirs the file tree shows (never .git)

# Ways to reach LLMs; ai.gateway picks one. The key is opencode's provider id.
gateways:
  openrouter:
    kind: openrouter
    api_key: { secret: openrouter_api_key }
    models:
      z-ai/glm-5.3:
        options:
          provider:
            order: [mistral/zdr, mistral, fireworks, together, parasail]
            only: [mistral/zdr, mistral, fireworks, together, parasail]
            zdr: true
            data_collection: deny
      mistralai/mistral-medium-3-5:  # the vision model: images and tools, ZDR endpoint
        options:
          provider:
            order: [mistral/zdr, mistral]
            only: [mistral/zdr, mistral]
            zdr: true
            data_collection: deny

# The ingest service (deploy/ingest): which Gmail label fills which vault's Input/. No profiles = the loop idles;
# only hetzner gets real ones (dev and test stacks must never read a real label). A profile:
#   mylife: { vault: mylife, label: MyLife, account: { secret: ingest_mylife_account },
#             allowed_senders: [{ secret: ingest_mylife_sender }], settings: { max_per_poll: 20 } }
ingest:
  # The Instagram worker's token (generated on the host like ingest_token): job routes only (#168).
  worker_token: { secret: ingest_worker_token, optional: true }
  # instagram_source: who scrapes Instagram, the ingest service itself (local) or a worker on the user's machine.
  defaults: { max_per_poll: 20, resolve_max_urls_per_mail: 5, run_interval_s: 900, instagram_source: local }
  profiles: {}
