# Dev override for numbered dev stacks: start one with `just dev up [N]` (deploy/dev.sh, deploy/stack.sh).
# Same stack, sources bind-mounted for hot reload; stack N on https://localhost:80N0 with Caddy's internal CA.
services:
  proxy:
    build: !reset null
    image: caddy:2.10-alpine
    ports: !override ["${PROXY_PORT:?start dev stacks with just dev up}:443"]
    environment: !reset {}
    secrets: !reset []
    volumes:
      - ./proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: !override
      backend: { condition: service_healthy }
      web: { condition: service_started }

  backend:
    # No image name: compose names it <project>-backend, so stacks (and prodtest's ghcr…:dev) never share a tag.
    image: !reset null
    build: { context: .., dockerfile: deploy/backend/Dockerfile, target: dev }
    # Debugging: the API without TLS, loopback only.
    ports: ["127.0.0.1:${BACKEND_PORT:?start dev stacks with just dev up}:8787"]
    environment:
      GIT_REMOTE_BASE: ${GIT_REMOTE_BASE:-https://github.com/}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Dev User}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-dev@example.com}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-ollama/qwen2.5:3b}
    volumes:
      - ../apps/backend/src:/app/apps/backend/src:ro
      - ../packages/shared/src:/app/packages/shared/src:ro
      # Local bare repos standing in for GitHub (GIT_REMOTE_BASE=file:///remotes/).
      - ../tmp/dev/remotes:/remotes

  opencode:
    image: !reset null
    # Dev LLM: local Ollama (no provider key needed). Provider config only; the managed
    # config /etc/opencode/opencode.json still wins.
    environment:
      OPENCODE_MODEL: ${DEFAULT_MODEL:-ollama/qwen2.5:3b}
      OPENCODE_CONFIG: /etc/opencode-dev/ollama.json
      # Ollama sits on a private IP, which the egress proxy refuses: reach it direct.
      NO_PROXY: localhost,127.0.0.1,0.0.0.0,ollama.internal
    volumes:
      - ./opencode/dev-ollama.json:/etc/opencode-dev/ollama.json:ro

  egress:
    image: !reset null

  # No profiles: the loop idles (dev stacks never read a real Gmail label).
  ingest:
    image: !reset null
    # The e2e suite's Instagram login: no Instagram, password `wrong` fails, user twofa… asks for code 000000.
    environment:
      INGEST_FAKE_INSTAGRAM_LOGIN: "1"
    volumes:
      - ingest-state:/state
      - ./ingest/config.none.json:/etc/ingest/config.json:ro
      - vaults:/vaults

  # The dev LLM is the native Ollama on the Mac (`just ollama install`), shared by all stacks. This relay
  # (proxy/Caddyfile.ollama-relay) is opencode's only route to it, and passes only the /v1 API.
  ollama:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes: ["./proxy/Caddyfile.ollama-relay:/etc/caddy/Caddyfile:ro"]
    networks:
      internal: { aliases: [ollama.internal] }
      egress: {}

  web:
    build: { context: .., dockerfile: deploy/web/Dockerfile.dev }
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      API_URL: http://backend:8787
      HMR_CLIENT_PORT: "${PROXY_PORT:?start dev stacks with just dev up}"
      # Header brand "karpathy #N".
      VITE_STACK: "${STACK:?start dev stacks with just dev up}"
    volumes:
      - ../apps/web/src:/app/apps/web/src:ro
      - ../packages/shared/src:/app/packages/shared/src:ro
      - ../apps/web/index.html:/app/apps/web/index.html:ro
      - ../apps/web/vite.config.ts:/app/apps/web/vite.config.ts:ro
      - ../apps/web/tsconfig.json:/app/apps/web/tsconfig.json:ro
      - ../assets:/app/assets:ro
    networks: [internal]

